<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Usar escáner oficial</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --txt:#1d2733; --sub:#5b6773; --borde:#d8dee4; --ok:#1f8a4c; --warn:#b7791f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 40px; }
  .panel { background:var(--card); border:1px solid var(--borde); border-radius:12px; padding:20px 16px; text-align:center; }
  h1 { font-size:22px; margin:0 0 10px; }
  p { margin:0 0 16px; color:var(--sub); }
  a.btn { display:block; background:var(--ok); color:#fff; text-decoration:none; font-size:20px; font-weight:700; padding:16px; border-radius:10px; }
  #pend { margin:16px 0 0; font-size:14px; }
  #pend.warn { color:var(--warn); font-weight:600; }
</style>
</head>
<body>
<main>
  <div class="panel">
    <h1>Use el escáner oficial</h1>
    <p>El registro de asistencia del congreso volvió al sistema de la intranet. Esta página de contingencia está desactivada.</p>
    <a class="btn" href="https://intranet.hospitalguayaquil.gob.ec/congreso/staff/login">Ir al escáner oficial</a>
    <p id="pend"></p>
  </div>
</main>
<script src="config.js"></script>
<script>
(function () {
  'use strict';
  // Si este celular guardó marcaciones de contingencia que no llegaron a la Hoja, se envían ahora (mismo formato que la página)
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  var marcas = [], enviadas = {};
  try { marcas = JSON.parse(lsGet('cc-marcas')) || []; enviadas = JSON.parse(lsGet('cc-enviadas')) || {}; } catch (e) {}
  var pend = marcas.filter(function (m) { return !enviadas[m.id]; });
  if (!pend.length) { return; }
  var el = document.getElementById('pend');
  var CFG = window.CONTINGENCIA || {};
  var clave = lsGet('cc-clave');
  function aviso(t) { el.textContent = t; el.className = 'warn'; }
  if (!CFG.SYNC_URL || !clave || !window.crypto || !crypto.subtle) {
    aviso('Este celular tiene ' + pend.length + ' marcaciones de contingencia sin enviar. Avise a TICs.');
    return;
  }
  el.textContent = 'Enviando ' + pend.length + ' marcaciones pendientes de este celular…';
  crypto.subtle.digest('SHA-256', new TextEncoder().encode('sync|' + clave)).then(function (h) {
    var token = Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
    return fetch(CFG.SYNC_URL, { method: 'POST', body: JSON.stringify({ t: token, marcas: pend.map(function (m) {
      return { id: m.id, codigo: m.codigo, tipo: m.tipo, fecha_hora: m.fecha_hora, staff: m.staff, origen: m.origen, dispositivo: m.dispositivo, nota: m.nota || '' };
    }) }) });
  }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.ok) { throw new Error(j.error || 'error'); }
    j.ids.forEach(function (id) { enviadas[id] = 1; });
    lsSet('cc-enviadas', JSON.stringify(enviadas));
    el.textContent = 'Listo: se enviaron las ' + pend.length + ' marcaciones pendientes de este celular.';
    el.className = '';
  }).catch(function () {
    aviso('Este celular tiene ' + pend.length + ' marcaciones sin enviar: vuelva a abrir esta página con señal o avise a TICs.');
  });
})();
</script>
</body>
</html>
